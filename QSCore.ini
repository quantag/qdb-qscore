# QSCore.ini - Default configuration file

# Enable or disable circuit rendering (1 = enabled, 0 = disabled)
render.circuit=1

# Path to demo .qasm file used when no program is provided
demo.file=./file1.qasm

# Source folder path for input files
source.folder=/var/dap/

# Logging level (0=ERROR, 1=WARN, 2=INFO, 3=DEBUG, 4=TRACE)
log.level=2

# QVM type: "qpp" (CPU simulator) or "cudaq" (GPU simulator, if built with ENABLE_CUDAQ)
qvm.type=cudaq

# CUDA-Q service endpoint (used when qvm.type=cudaq)
cudaq.srv=https://cloud.quantag-it.com/api1/run

# QSCore.ini
mode=server
file=
test.folder=../test/qasm
output.file=results.json
dap.host=127.0.0.1
ws.host=127.0.0.1

